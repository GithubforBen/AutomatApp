# time it takes for a login to be invalidated
invalidation-time: 14
website-url: "http://127.0.0.1:8080"
dispenser-url: "http://192.168.188.202"
scanner-url: "http://192.168.188.201"
station-url: "http://192.168.188.203"
default-logout-time: 10
window-dimension:
  horizontal: 480
  vertical: 800
shutdown-delay: 30
# PINs am Automaten (Bambi unten rechts): Admin-Bildschirm und Einstellungen.
# 4 bis 12 Ziffern, in Anführungszeichen. Unbedingt eigene setzen - diese
# Standardwerte stehen öffentlich im Quelltext.
admin-pin: "12345"
settings-pin: "33333"
# HMAC-Schlüssel der ESP32 (HMAC_KEY_ID in deren .env). Damit signiert der
# Automat Ausgabe, Alarm und Updates; die Geräte nehmen nur signierte an.
esp-key-id: "ausgabe"
